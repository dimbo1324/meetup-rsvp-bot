version: 2
updates:
  # Все действия GitHub — одним PR в месяц
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # Один uv.lock на весь монорепозиторий: все обновления зависимостей — одним PR в месяц,
  # чтобы шлюз качества всех ботов прогонялся один раз, а не на каждую библиотеку.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # aiogram 3.31 требует Python < 3.15 (.ai/project/11-commands.md)
      - dependency-name: "python"
        versions: [">=3.15"]

  # Образ каждого бота с Dockerfile — отдельная запись
  - package-ecosystem: docker
    directory: /bots/meetup-rsvp-bot
    schedule:
      interval: monthly
    ignore:
      # Python 3.15 запрещён, пока aiogram требует < 3.15 (.ai/project/11-commands.md)
      - dependency-name: "python"
        versions: [">=3.15"]
