# Проектные настройки Codex для meetup-rsvp-bot.
# Личные учётные данные, авторизация плагинов и абсолютные пути конкретной машины
# хранятся в ~/.codex/config.toml или .codex/config.local.toml, но не в репозитории.

model_reasoning_effort = "high"

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 3600
