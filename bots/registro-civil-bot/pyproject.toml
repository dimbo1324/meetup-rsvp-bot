[project]
name = "registro-civil-bot"
version = "0.1.0"
description = "Наблюдатель за свободными датами записи в Registro Civil (Уругвай) с уведомлением владельца"
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Стек — SPEC.md, раздел 2.1. Нижние границы — версии из ТЗ, точные версии — в uv.lock.
dependencies = [
    "aiohttp>=3.14.5,<4",
    "aiogram>=3.31,<4",
    "aiogram-dialog>=2.6,<3",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.16.1",
    "tzdata>=2026.5",
    "sentry-sdk>=2.73",
    "uvloop>=0.23; sys_platform == 'linux'",
    "playwright>=1.65",
    "keyring>=25.7",
]

[project.scripts]
rcbot = "rcbot.cli:main"

# Общие инструменты (pytest, ruff, mypy, pip-audit) — в dev-группе корня монорепозитория.
# Тесты бота: hypothesis — свойства детектора, разбора и редактора; trustme — локальный TLS-сервер
# вместо живого сайта; pytest-timeout — зависший тест не вешает прогон (решение R7).
[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "trustme>=1.2",
    "pytest-timeout>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcbot"]

# Контракт бота для dev.py (docs/monorepo.md).
[tool.monorepo]
package = "rcbot"
platform = "windows-desktop"
# Chromium для Playwright живёт в каталоге бота (SPEC.md, 2.7), а не в профиле пользователя.
env = { PLAYWRIGHT_BROWSERS_PATH = "./.browsers" }
setup = [["playwright", "install", "chromium"]]
# Полный прогон тестов проверяет порог покрытия этих пакетов (SPEC 3.4)
coverage = ["rcbot.domain", "rcbot.application"]
coverage_min = 85

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]
# Файлы миграций генерирует Alembic
"src/rcbot/infrastructure/db/migrations/versions/*" = ["E501", "I001", "UP", "RUF"]

# SPEC.md, 3.4: mypy --strict для всего кода бота.
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
timeout = 60
pythonpath = ["."]
filterwarnings = [
    # «coroutine was never awaited» — всегда настоящая ошибка, не шум
    "error::RuntimeWarning",
]
markers = [
    "browser: нужен Chromium из .browsers/ (dev.py setup); без него тест пропускается",
    "slow: дольше пяти секунд",
]

[tool.coverage.run]
source = ["src/rcbot"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.$',
]
