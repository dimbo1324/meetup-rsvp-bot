[project]
name = "meetup-rsvp-bot"
version = "0.1.0"
description = "Telegram-бот для записи на встречи с ограниченным числом мест"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31,<4",
    "aiogram-dialog>=2.6,<3",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pydantic-settings>=2.16",
    "tzdata>=2026.5",
    "uvloop>=0.23; sys_platform == 'linux'",
    "sentry-sdk>=2.73",
]

# Инструменты разработки (pytest, ruff, mypy) — в dev-группе корня монорепозитория.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetup_bot"]

# Контракт бота для dev.py (docs/monorepo.md): импортируемый пакет и способ запуска.
[tool.monorepo]
package = "meetup_bot"
platform = "linux-docker"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]
# Файлы миграций генерирует Alembic
"alembic/versions/*" = ["E501", "I001", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "meetup_bot.services.*",
    "meetup_bot.repositories.*",
    "meetup_bot.renderer.*",
    "meetup_bot.clock",
    "meetup_bot.config",
    "meetup_bot.db.*",
    "meetup_bot.telegram.*",
]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/meetup_bot"]
branch = true
