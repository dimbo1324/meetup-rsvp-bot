# Одна локация — один сервис: свой бот в @BotFather, свой .env, свой каталог с БД.
# Запуск и обновление на сервере: docker compose up -d --build (подробно — README.md).
services:
  bot:
    image: ghcr.io/dimbo1324/meetup-rsvp-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/bot.db
    volumes:
      - ./data:/app/data
    mem_limit: 300m
    # Минимум привилегий: бот не пишет никуда, кроме /app/data и /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Шаблон второй локации. Чтобы включить: раскомментируйте блок, замените <локация>
  # на короткое латинское имя (например, punta), создайте .env.<локация> по образцу
  # .env.example с ТОКЕНОМ ДРУГОГО БОТА, своими OWNER_IDS и SERVICE_CHAT_ID, затем
  # создайте каталог data-<локация> с владельцем 10001 (как для ./data, см. README.md).
  # Образ общий: код один, данные и бот у каждой локации свои. Один токен нельзя
  # использовать в двух сервисах — они будут перехватывать друг у друга обновления.
  #
  # bot-<локация>:
  #   image: ghcr.io/dimbo1324/meetup-rsvp-bot:${IMAGE_TAG:-latest}
  #   build: .
  #   restart: unless-stopped
  #   env_file: .env.<локация>
  #   environment:
  #     DATABASE_URL: sqlite+aiosqlite:////app/data/bot.db
  #   volumes:
  #     - ./data-<локация>:/app/data
  #   mem_limit: 300m
  #   security_opt:
  #     - no-new-privileges:true
  #   cap_drop:
  #     - ALL
  #   read_only: true
  #   tmpfs:
  #     - /tmp
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: 10m
  #       max-file: "3"
