# Хуки коммита только нормализуют индексируемое: форматирование и гигиену файлов.
# Линтер, строгая типизация и тесты работают в шлюзе качества (`dev.py quality-gate`).
# Все инструменты запускаются из окружения uv, версии зафиксированы в uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: sync-agents
        name: AGENTS.md в синхронизации с .ai/
        entry: uv run --no-sync python -m scripts.sync_agents --check
        language: system
        pass_filenames: false
        files: ^(\.ai/|AGENTS\.md$|scripts/sync_agents\.py$)
      - id: forbid-env-files
        name: запрет коммита .env
        entry: python -c "import sys; print('.env нельзя коммитить:', *sys.argv[1:]); sys.exit(1)"
        language: system
        files: (^|/)\.env$
